<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silvique | Handmade silver jewellery</title>
<meta name="description" content="Handmade &amp; curated silver jewellery from Kenya. Rings, earrings, bracelets and more. Order on WhatsApp.">
<meta name="theme-color" content="#ffffff">

<!-- Link preview (WhatsApp, Instagram, etc). After you deploy, replace the two URLs below with your real
     site address, and add a 1200x630 image named preview.jpg (under ~300KB) next to index.html. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Silvique | Handmade silver jewellery">
<meta property="og:description" content="Handmade &amp; curated silver jewellery from Kenya. Order on WhatsApp.">
<meta property="og:url" content="https://USERNAME.github.io/REPO/">
<meta property="og:image" content="https://USERNAME.github.io/REPO/preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* BRAND FONT: Brittany is a Canva font, so it can't load from a CDN.
   To use it, export the font file and uncomment (host it, or embed as a data: URI):
@font-face { font-family: 'Brittany'; src: url('brittany.woff2') format('woff2'); font-display: swap; }
*/
:root {
  box-sizing: border-box;
  --black: #000;
  --white: #fff;
  --grey: #a3a3a3;      /* secondary text on black */
  --ink: #0a0a0a;       /* text on white */
  --muted: #666;        /* secondary text on white */
  --line: #e3e3e3;
  --tile: #fff;         /* photo background */
  --photo-ratio: 3 / 4;   /* photo frame shape. 3 / 4 = tall, 4 / 5 = a bit shorter */
  --script: 'Brittany', 'Allura', cursive;
  --sans: 'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--white); color: var(--ink); font-family: var(--sans); font-weight: 300; line-height: 1.6; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }

/* ---------- Hero ---------- */
.hero { text-align: center; padding: calc(80px + env(safe-area-inset-top, 0px)) 20px 72px; background: var(--white); color: var(--ink); }
.tagline { margin: 20px auto 0; max-width: 34ch; color: var(--muted); font-size: 17px; letter-spacing: .02em; }
.wordmark { font-family: var(--script); font-weight: 400; font-size: clamp(96px, 26vw, 260px); line-height: .9; margin: 0; }

/* ---------- White shop ---------- */
.shop { background: var(--white); color: var(--ink); }
.shop-inner { max-width: 1180px; margin: 0 auto; padding: 40px 16px 72px; }

.filters { display: grid; gap: 18px; padding-bottom: 8px; margin-bottom: 24px; }
.group { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.label { font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-weight: 400; font-size: 15px; color: var(--ink); background: var(--white); border: 1px solid #cfcfcf; border-radius: 999px; padding: 7px 16px; cursor: pointer; }
.chip .n { color: var(--muted); font-size: 13px; margin-left: 4px; }
.chip:hover:not(:disabled) { border-color: var(--ink); }
.chip[aria-pressed="true"] { color: var(--white); background: var(--black); border-color: var(--black); }
.chip[aria-pressed="true"] .n { color: #bdbdbd; }
.chip:disabled { opacity: .35; cursor: default; }
.status { display: flex; align-items: center; gap: 14px; min-height: 28px; color: var(--muted); font-size: 15px; }
.clear { font: inherit; font-size: 15px; color: var(--ink); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px 14px; }
@media (min-width: 760px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 44px 24px; } }
@media (min-width: 1040px) { .grid { grid-template-columns: repeat(4, 1fr); } }

.item { display: flex; flex-direction: column; }
.photo { position: relative; aspect-ratio: var(--photo-ratio); background: var(--tile); display: grid; place-items: center; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.photo .ph { font-family: var(--script); font-size: 44px; color: #c4c4c4; }
.item h2 { font-size: 18px; font-weight: 400; margin: 14px 0 0; line-height: 1.3; }
.price { font-weight: 500; margin: 4px 0 14px; }
.order { display: block; text-align: center; text-decoration: none; color: var(--white); background: var(--black); border: 1px solid var(--black); padding: 10px 12px; font-weight: 400; font-size: 15px; }
.order:hover { background: var(--white); color: var(--black); }
.empty { text-align: center; color: var(--muted); padding: 56px 0; }

/* Sold out (one-off pieces) */
.item.sold .photo { opacity: .45; }
.item.sold h2, .item.sold .price { color: var(--muted); }
.order.soldout, .order.soldout:hover { background: var(--white); color: var(--muted); border-color: #cfcfcf; cursor: default; }

/* Phones: one scrolling row per filter group, shorter hero so products show sooner */
@media (max-width: 759px) {
  .hero { padding: calc(36px + env(safe-area-inset-top, 0px)) 20px 24px; }
  .tagline { margin-top: 10px; font-size: 15px; }
  .shop-inner { padding-top: 16px; }
  .filters { gap: 14px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 2px 16px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; white-space: nowrap; }
}

/* ---------- Black footer ---------- */
footer { text-align: center; padding: 44px 20px calc(56px + env(safe-area-inset-bottom, 0px)); background: var(--black); color: var(--grey); font-size: 15px; }
footer .sig { font-family: var(--script); font-size: 56px; color: var(--white); display: block; line-height: 1; margin-bottom: 10px; }
footer a { color: var(--white); }

:focus-visible { outline: 2px solid #2b6cff; outline-offset: 3px; }
</style>
</head>
<body>

<header class="hero">
  <h1 class="wordmark">Silvique</h1>
  <p class="tagline">Handmade &amp; Curated Silver Jewellery</p>
</header>

<div class="shop">
  <div class="shop-inner">
    <section class="filters" aria-label="Filters">
      <div class="group">
        <span class="label" id="lblPiece">Piece</span>
        <div class="chips" id="pieceChips" role="group" aria-labelledby="lblPiece"></div>
      </div>
      <div class="group">
        <span class="label" id="lblOrigin">Origin</span>
        <div class="chips" id="originChips" role="group" aria-labelledby="lblOrigin"></div>
      </div>
      <div class="status">
        <span id="count" aria-live="polite"></span>
        <button class="clear" id="clear" hidden>Clear filters</button>
      </div>
    </section>

    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>Nothing matches those filters.</p>
  </div>
</div>

<footer>
  <span class="sig">Silvique</span>
  Message us on <a id="footWa" href="#">WhatsApp</a> to order or ask about a piece.
</footer>

<script>
/* ===== EDIT THESE ===== */
const WHATSAPP = "254758814018";   // your number, country code first, no + or spaces
const CURRENCY = "KES";

// Display order of the filter chips. Anything not listed here still appears, after these.
const PIECE_ORDER  = ["Rings", "Earrings", "Necklaces", "Bracelets", "Armcuffs", "Bellyrings"];
const ORIGIN_ORDER = ["Handmade", "Upcycled", "Thrifted", "New"];
const SHOW_SOLD = true;            // true: sold pieces stay visible (greyed, at the end). false: hide them.

const PRODUCTS = [
  // category: what the piece is.  origin: Handmade | Upcycled | Thrifted | New
  // To mark a one-off as gone, add  soldOut: true  to that product, e.g.  { name: "...", ..., soldOut: true },
  { name: "Crystal Green & Blue Dangle Earrings",       category: "Earrings",      origin: "Handmade", price: 600, image: "images/E9.png" },
  { name: "Black & Silver Spiral Earrings",       category: "Earrings",      origin: "Handmade", price: 500, image: "images/E10.png" },
  { name: "Amethyst & Gems Dangle Earrings",       category: "Earrings",      origin: "Handmade", price: 500, image: "images/E11.png" },
  { name: "Peach Spiral Dangle Earrings",       category: "Earrings",      origin: "Handmade", price: 500, image: "images/E12.png" },
  { name: "Lavender Amethyst Earrings",       category: "Earrings",      origin: "Handmade", price: 500, image: "images/E13.png" },
  { name: "Lilac Triple Earrings",       category: "Earrings",      origin: "Handmade", price: 400, image: "images/E14.png" },
  { name: "Marble Onyx & Silver Spiral Earrings",       category: "Earrings",      origin: "Handmade", price: 500, image: "images/E15.png" },
  { name: "Lavender Marble Seaside Charm Bracelet",       category: "Bracelets",      origin: "Handmade", price: 400, image: "images/H9.png" },
   { name: "Brass Flower Armcuff",       category: "Armcuffs",   origin: "Handmade", price: 700, image: "images/A1.png" },
  { name: "Pointer Armcuff",            category: "Armcuffs",   origin: "Handmade", price: 700, image: "images/A2.png" },
  { name: "Crystal silver Bellyring",   category: "Bellyrings", origin: "Handmade", price: 400, image: "images/B1.png" },
  { name: "Red Gem Belly Button Piercing", category: "Bellyrings", origin: "Handmade", price: 400, image: "images/B2.png" },
  { name: "Chunky Flower Vacuum-Plated Earrings", category: "Earrings", origin: "New", price: 600, image: "images/E5.png" },
  { name: "Infinity Swirls",            category: "Earrings",   origin: "Upcycled", price: 400, image: "images/E6.png" },
  { name: "Side Cross Ring",            category: "Rings",      origin: "New", price: 400, image: "images/F1.png" },
  { name: "Lizard Double Ring",         category: "Rings",      origin: "New", price: 600, image: "images/F2.png" },
  { name: "Crystal Masc Ring",          category: "Rings",      origin: "New", price: 400, image: "images/F3.png"},
  { name: "Delicate Flower Ring",       category: "Rings",      origin: "New", price: 250, image: "images/F4.png", soldOut: true },
  { name: "Tripple Dot Ring",           category: "Rings",      origin: "New", price: 250, image: "images/F5.png", soldOut: true },
  { name: "Tiny Crystal Ring",          category: "Rings",      origin: "New", price: 250, image: "images/F6.png", soldOut: true },
  { name: "Chained Ring",               category: "Rings",      origin: "New", price: 250, image: "images/F7.png", soldOut: true },
 { name: "Yellow Gem Ring", category: "Rings", origin: "New", price: 250, image: "images/F8.png", soldOut: true },
  { name: "Yin Yang Chunky Ring",       category: "Rings",      origin: "Handmade", price: 600, image: "images/F9.png" },
  { name: "Peach Crystal Earrings",  category: "Earrings",  origin: "Handmade", price: 500, image: "images/E16.png" },
  { name: "Ocean Blue Shell Bracelet",       category: "Bracelets",      origin: "Handmade", price: 400, image: "images/H10.png" },
  { name: "Pink & Silver Earrings",       category: "Earrings",      origin: "Handmade", price: 600, image: "images/E17.png" },
  { name: "Red Shell Charm Bracelet",       category: "Bracelets",      origin: "Handmade", price: 400, image: "images/H11.png" },
  { name: "Silver Chain with Marble Stone Pendant",       category: "Necklaces",      origin: "Handmade", price: 600, image: "images/N4.png" },
  { name: "Silver Charm Bracelet",       category: "Bracelets",      origin: "Handmade", price: 400, image: "images/H12.png" },
  { name: "Silver Spiral Ring with Blush Blossom",       category: "Rings",      origin: "Handmade", price: 400, image: "images/F10.png" },
  { name: "Silver Spiral Ring with Jade Bead",       category: "Rings",      origin: "Handmade", price: 400, image: "images/F12.png" },
  { name: "Silver Spiral Evil Eye Earrings",       category: "Earrings",      origin: "Handmade", price: 500, image: "images/E18.png" },
  { name: "Pink & Red Starfish Earrings",       category: "Earrings",      origin: "Handmade", price: 500, image: "images/E19.png" },
  { name: "Amber Wire-Wrapped Pendant with Shell Adjuster",       category: "Necklaces",      origin: "Handmade", price: 600, image: "images/F10.png" },
  { name: "Amethyst Orbit Earrings",       category: "Earrings",      origin: "Handmade", price: 600, image: "images/E7.png" },
  { name: "Sunset Earrings",       category: "Earrings",      origin: "Handmade", price: 500, image: "images/E8.png" },
  { name: "Jade & Shell Necklace",       category: "Necklaces",      origin: "Handmade", price: 500, image: "images/N3.png" },

  { name: "Cage Bracelet",              category: "Bracelets",  origin: "Handmade", price: 400, image: "images/H2.png" },
  { name: "Green Beads Bracelet",       category: "Bracelets",  origin: "Handmade", price: 400, image: "images/H3.png" },
  { name: "Embroidered Flower Bracelet", category: "Bracelets", origin: "Handmade", price: 400, image: "images/H4.png" },
  { name: "Double Swirl Brass Bracelet", category: "Bracelets", origin: "Handmade", price: 400, image: "images/H5.png" },
  { name: "Fingerprint Bracelet",       category: "Bracelets",  origin: "Handmade", price: 400, image: "images/H6.png" },
  { name: "Knot Bracelet",              category: "Bracelets",  origin: "Handmade", price: 400, image: "images/H7.png" },
  { name: "Circle Bracelet",            category: "Bracelets",  origin: "Handmade", price: 400, image: "images/H8.png" },
  { name: "Anchor & Rubber Earrings",   category: "Earrings",   origin: "Handmade", price: 600, image: "images/E2.png" },
  { name: "Two-point Ear-climber",      category: "Earrings",   origin: "Handmade", price: 600, image: "images/E3.png" },
  { name: "Baby Pearls",                category: "Earrings",   origin: "Handmade", price: 600, image: "images/E4.png" }
];
/* ====================== */

const $ = id => document.getElementById(id);
const fmt = n => CURRENCY + " " + Number(n).toLocaleString("en-KE");
const wa = text => "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(text);

// Chip order: preferred order first, then any new values you add to products.
const order = (preferred, key) => {
  const present = [...new Set(PRODUCTS.map(p => p[key]).filter(Boolean))];
  return [...preferred.filter(v => present.includes(v)), ...present.filter(v => !preferred.includes(v))];
};
const PIECES  = order(PIECE_ORDER, "category");
const ORIGINS = order(ORIGIN_ORDER, "origin");

const state = { piece: "All", origin: "All" };
const matches = (p, piece, origin) =>
  (SHOW_SOLD || !p.soldOut) &&
  (piece === "All" || p.category === piece) && (origin === "All" || p.origin === origin);

function makeChips(host, values, key, other) {
  host.innerHTML = "";
  ["All", ...values].forEach(v => {
    // Count what you'd get if you picked this chip, given the other filter.
    const n = PRODUCTS.filter(p => key === "piece" ? matches(p, v, state.origin) : matches(p, state.piece, v)).length;
    const b = document.createElement("button");
    b.className = "chip";
    b.setAttribute("aria-pressed", String(state[key] === v));
    b.disabled = n === 0 && state[key] !== v;
    b.innerHTML = v + '<span class="n">' + n + "</span>";
    b.onclick = () => { state[key] = v; render(); };
    host.appendChild(b);
  });
}

function render() {
  makeChips($("pieceChips"), PIECES, "piece");
  makeChips($("originChips"), ORIGINS, "origin");

  const list = PRODUCTS.filter(p => matches(p, state.piece, state.origin))
    .sort((a, b) => (a.soldOut ? 1 : 0) - (b.soldOut ? 1 : 0));  // sold pieces go last
  const filtered = state.piece !== "All" || state.origin !== "All";
  $("count").textContent = list.length + (list.length === 1 ? " piece" : " pieces");
  $("clear").hidden = !filtered;
  $("empty").hidden = list.length > 0;

  const grid = $("grid");
  grid.innerHTML = "";
  list.forEach(p => {
    const el = document.createElement("article");
    el.className = "item" + (p.soldOut ? " sold" : "");

    const photo = document.createElement("div");
    photo.className = "photo";
    const placeholder = () => { photo.innerHTML = '<span class="ph">Silvique</span>'; };
    if (p.image) {
      const img = document.createElement("img");
      img.src = p.image; img.alt = p.name; img.loading = "lazy";
      img.onerror = () => { img.remove(); placeholder(); };
      photo.appendChild(img);
    } else {
      placeholder();
    }

    const h = document.createElement("h2"); h.textContent = p.name;
    const pr = document.createElement("p"); pr.className = "price"; pr.textContent = fmt(p.price);
    let a;
    if (p.soldOut) {
      a = document.createElement("span");
      a.className = "order soldout"; a.textContent = "Sold out";
      a.setAttribute("aria-disabled", "true");
    } else {
      a = document.createElement("a");
      a.className = "order"; a.target = "_blank"; a.rel = "noopener";
      a.textContent = "Order on WhatsApp";
      a.href = wa("Hi Silvique, I'd like to order the " + p.name + " (" + fmt(p.price) + ").");
    }
    el.append(photo, h, pr, a);
    grid.appendChild(el);
  });
}

$("clear").onclick = () => { state.piece = "All"; state.origin = "All"; render(); };
$("footWa").href = wa("Hi Silvique, I have a question about your jewellery.");
render();
</script>
</body>
</html>
